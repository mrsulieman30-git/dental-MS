services:
  dentalos.api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: dentalos/api
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      - mysql
      - redis
      - elasticsearch

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dentalms
    volumes:
      - dentalos_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

volumes:
  dentalos_mysql:
